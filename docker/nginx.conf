server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames change whenever their contents do, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # `index.html` must never be cached: it is what points at the current
    # asset hashes, and a stale copy pins the browser to a deleted bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: `/rooms/<id>` is a real URL a user can open or
    # reload, but there is no file at that path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app never frames anything and is never framed.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
